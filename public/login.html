<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — ProyectoSueldos</title>
  <!-- Tabler Core CSS -->
  <link rel="stylesheet" href="/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/vendor/tabler-icons/tabler-icons.min.css">
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="d-flex flex-column bg-light">
  <div class="page page-center">
    <div class="container container-tight py-4">
      <div class="text-center mb-4">
        <a href="/" class="navbar-brand navbar-brand-autodark justify-content-center">
          <div class="brand-icon me-2">PS</div>
          <span class="fs-2">ProyectoSueldos</span>
        </a>
      </div>

      <div class="card card-md shadow-xs">
        <div class="card-body">
          <h2 class="h2 text-center mb-4">Acceso a la Plataforma</h2>

          <div id="login-alert" class="alert alert-danger d-none mb-3" role="alert"></div>

          <form id="login-form" autocomplete="off">
            <div class="mb-3">
              <label class="form-label required">Correo Electrónico</label>
              <input
                type="email"
                id="email"
                class="form-control"
                placeholder="tu@estudiocontable.com"
                required
                autofocus
              >
            </div>
            <div class="mb-3">
              <label class="form-label required">Contraseña</label>
              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Tu contraseña"
                required
              >
            </div>

            <div class="form-footer">
              <button type="submit" class="btn btn-primary w-100">
                Iniciar Sesión
              </button>
            </div>
          </form>

          <!-- Acceso rápido para pruebas -->
          <div class="hr-text my-3">o usa acceso demo</div>
          <div class="card bg-light-subtle border-dashed p-2 text-center">
            <div class="small text-muted mb-2">Usuario registrado en la base local:</div>
            <button type="button" id="btn-demo-creds" class="btn btn-sm btn-outline-secondary w-100">
              <i class="ti ti-key me-1"></i> Cargar datos de Javier (Demo)
            </button>
          </div>
        </div>
      </div>

      <div class="text-center text-muted mt-3">
        ¿Aún no tienes una cuenta? <a href="/register.html" tabindex="-1">Regístrate aquí</a>
      </div>
      <div class="text-center mt-2">
        <a href="/" class="small text-muted"><i class="ti ti-arrow-left me-1"></i> Volver al inicio</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="/vendor/tabler/js/tabler.min.js"></script>
  <script type="module">
    import { initLoginForm, checkAlreadyAuthenticated } from '/js/auth.js';
    checkAlreadyAuthenticated();
    initLoginForm();
  </script>
</body>
</html>
