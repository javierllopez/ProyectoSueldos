<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control — ProyectoSueldos</title>
  <!-- Tabler Core CSS -->
  <link rel="stylesheet" href="/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/vendor/tabler-icons/tabler-icons.min.css">
  <link rel="stylesheet" href="/vendor/tabler/libs/tom-select/dist/css/tom-select.bootstrap5.min.css">
  <link rel="stylesheet" href="/css/custom.css?v=custom-2.6">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/personnel.css?v=personnel-2.3">
  <link rel="stylesheet" href="/css/admin.css?v=admin-1.0">
  <link rel="stylesheet" href="/css/payroll.css?v=payroll-1.4">
</head>

<body>
  <div class="page">
    <!-- Navbar Superior -->
    <header class="navbar navbar-expand-md d-print-none header-luxury-dark border-bottom shadow-xs">
      <div class="container-xl">
        <!-- Logo y Nombre -->
        <a href="/app.html" class="navbar-brand navbar-brand-autodark me-4" aria-label="ProyectoSueldos Inicio">
          <div class="brand-icon">PS</div>
          <span>ProyectoSueldos</span>
        </a>

        <!-- Selector de Empresa Activa (Tenant Switcher) -->
        <div class="d-flex align-items-center me-auto">
          <div class="dropdown">
            <button class="btn company-selector-btn-luxury dropdown-toggle company-selector-btn" type="button"
              id="active-company-btn" data-bs-toggle="dropdown" aria-expanded="false"
              aria-label="Seleccionar empresa activa">
              <span class="spinner-border spinner-border-sm me-2"></span>Cargando empresa...
            </button>
            <div class="dropdown-menu shadow-sm" id="company-selector-dropdown" style="min-width: 260px;">
              <!-- Dinámico vía app.js -->
            </div>
          </div>
        </div>

        <!-- Perfil de Usuario y Logout -->
        <div class="navbar-nav flex-row order-md-last align-items-center gap-3">
          <div class="d-none d-md-block text-end">
            <div class="fw-bold user-fullname text-white">Cargando...</div>
            <div class="d-flex align-items-center justify-content-end gap-1">
              <span class="user-role-badge badge bg-secondary-lt">...</span>
              <small class="account-name" style="color: var(--dash-slate-400);">...</small>
            </div>
          </div>

          <div class="nav-item dropdown">
            <a href="#" class="nav-link d-flex lh-1 text-reset p-0" data-bs-toggle="dropdown"
              aria-label="Menú de perfil">
              <span class="avatar avatar-sm bg-primary text-white rounded-circle">
                <i class="ti ti-user"></i>
              </span>
            </a>
            <div class="dropdown-menu dropdown-menu-end shadow-sm">
              <div class="dropdown-header">
                <strong class="user-fullname">Usuario</strong>
                <div class="small text-muted account-name">Cuenta</div>
              </div>
              <div class="dropdown-divider"></div>
              <a href="#" class="dropdown-item" data-view-target="companies">
                <i class="ti ti-building me-2"></i> Empresas
              </a>
              <a href="#" class="dropdown-item admin-only" data-view-target="users">
                <i class="ti ti-users me-2"></i> Usuarios y Permisos
              </a>
              <a href="#" class="dropdown-item" data-view-target="account">
                <i class="ti ti-shield-check me-2"></i> Mi Cuenta
              </a>
              <div class="dropdown-divider"></div>
              <a href="#" id="btn-logout" class="dropdown-item text-danger">
                <i class="ti ti-logout me-2"></i> Cerrar Sesión
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Sub-Navbar de Navegación por Módulos -->
    <div class="navbar-expand-md">
      <div class="collapse navbar-collapse" id="navbar-menu">
        <div class="navbar subnav-luxury-dark border-bottom">
          <div class="container-xl">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" href="#" data-view-target="dashboard" aria-label="Ir a Inicio">
                  <span class="nav-link-icon d-md-none d-lg-inline-block"><i class="ti ti-home"></i></span>
                  <span class="nav-link-title">Inicio</span>
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#" data-view-target="employees" aria-label="Ir a Personal">
                  <span class="nav-link-icon d-md-none d-lg-inline-block"><i class="ti ti-users-group"></i></span>
                  <span class="nav-link-title">Personal</span>
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#" data-view-target="payroll" aria-label="Ir a Sueldos">
                  <span class="nav-link-icon d-md-none d-lg-inline-block"><i class="ti ti-calculator"></i></span>
                  <span class="nav-link-title">Sueldos</span>
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#" data-view-target="companies" aria-label="Ir a Empresas">
                  <span class="nav-link-icon d-md-none d-lg-inline-block"><i
                      class="ti ti-building-community"></i></span>
                  <span class="nav-link-title">Empresas</span>
                </a>
              </li>
              <li class="nav-item admin-only">
                <a class="nav-link" href="#" data-view-target="users" aria-label="Ir a Colaboradores y Permisos">
                  <span class="nav-link-icon d-md-none d-lg-inline-block"><i class="ti ti-shield-lock"></i></span>
                  <span class="nav-link-title">Colaboradores</span>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <!-- Contenido Principal -->
    <div class="page-wrapper">
      <div class="page-body">
        <div class="container-xl" id="app-views-container">
          <div id="app-bootstrap-loader" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <div class="text-muted small mt-2">Cargando módulos del sistema...</div>
          </div>
        </div> <!-- /.container-xl -->
      </div> <!-- /.page-body -->
    </div> <!-- /.page-wrapper -->
  </div> <!-- /.page -->


  <div id="app-modals-anchor" class="d-none"></div>

  <!-- Contenedor Dedicado para Impresión A4 de Informes Disciplinarios e Historial de Legajo -->
  <div id="disciplinary-print-container" class="d-none"></div>

  <!-- Contenedor Oficial para Impresión de Lote de Recibos A4 -->
  <div id="batch-payslip-print-container" class="d-none"></div>

  <!-- Contenedor Dedicado para Impresión A4 de Informe de Auditoría de Liquidación -->
  <div id="audit-payslip-print-container" class="d-none"></div>

  <!-- Visor Flotante de Ampliación de Foto de Empleado (Hover Zoom) -->
  <div id="employee-photo-zoom-popover" class="employee-photo-zoom-popover d-none" aria-hidden="true">
    <div class="employee-photo-zoom-img-wrap">
      <img id="employee-photo-zoom-img" src="" alt="Foto del empleado ampliada" />
    </div>
    <div class="employee-photo-zoom-caption" id="employee-photo-zoom-caption">Vista ampliada</div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="/vendor/tabler/js/tabler.min.js"></script>
  <script src="/vendor/tabler/libs/tom-select/dist/js/tom-select.complete.min.js"></script>
  <script src="/vendor/tabler/libs/apexcharts/dist/apexcharts.min.js"></script>
  <script src="/vendor/xlsx/xlsx.full.min.js"></script>
  <script>
    if (window.tabler) {
      window.bootstrap = window.tabler.bootstrap || window.tabler;
    }
  </script>
  <script type="module" src="/js/app.js?v=app-4.6"></script>
</body>

</html>
